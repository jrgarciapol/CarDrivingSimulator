<svg xmlns="http://www.w3.org/2000/svg" width="560" height="560" viewBox="0 0 560 560">
  <defs>
    <!-- Bisel titanio -->
    <radialGradient id="bezel" cx="50%" cy="42%" r="60%">
      <stop offset="0%"  stop-color="#6b6f76"/>
      <stop offset="55%" stop-color="#4a4d52"/>
      <stop offset="100%" stop-color="#2a2c30"/>
    </radialGradient>
    <linearGradient id="bezelRing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#8a8e95"/>
      <stop offset="100%" stop-color="#33353a"/>
    </linearGradient>
    <!-- Brillo AMOLED sutil -->
    <radialGradient id="glass" cx="50%" cy="30%" r="80%">
      <stop offset="0%"  stop-color="#0c0c10"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>

  <!-- Cuerpo / bisel del reloj -->
  <circle cx="280" cy="280" r="278" fill="url(#bezelRing)"/>
  <circle cx="280" cy="280" r="262" fill="url(#bezel)"/>

  <!-- Marcas del bisel (estilo Epix Pro) -->
  <g fill="#c9ccd1" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    <text x="280" y="46">60</text>
    <text x="514" y="285">15</text>
    <text x="280" y="528">30</text>
    <text x="52"  y="285">45</text>
  </g>

  <!-- Botones laterales -->
  <rect x="546" y="150" width="12" height="34" rx="4" fill="#2a2c30"/>
  <rect x="546" y="262" width="12" height="46" rx="4" fill="#2a2c30"/>
  <rect x="546" y="386" width="12" height="34" rx="4" fill="#2a2c30"/>

  <!-- ===== Pantalla AMOLED 454x454 (escalada a 400 dentro del bisel) ===== -->
  <!-- La esfera se dibuja con las mismas proporciones que el código:
       fecha 30% · hora 50% · línea 68% · segundos 78% -->
  <clipPath id="screen"><circle cx="280" cy="280" r="227"/></clipPath>
  <g clip-path="url(#screen)">
    <rect x="53" y="53" width="454" height="454" fill="url(#glass)"/>

    <!-- Fecha (30% de 454 = 136 -> 53+136 = 189) -->
    <text x="280" y="189" fill="#AAAAAA" font-family="Arial, sans-serif"
          font-size="34" font-weight="600" letter-spacing="4"
          text-anchor="middle" dominant-baseline="middle">SAB 09 AGO</text>

    <!-- Hora (50% -> 53+227 = 280) -->
    <text x="280" y="280" fill="#FFFFFF"
          font-family="'Arial Narrow', Arial, sans-serif"
          font-size="176" font-weight="700" letter-spacing="2"
          text-anchor="middle" dominant-baseline="middle">10:24</text>

    <!-- Línea de acento (68% -> 53+309 = 362) -->
    <rect x="207" y="360" width="146" height="4" rx="2" fill="#1E9BFF"/>

    <!-- Segundos (78% -> 53+354 = 407) -->
    <text x="280" y="410" fill="#1E9BFF"
          font-family="'Arial Narrow', Arial, sans-serif"
          font-size="64" font-weight="700" letter-spacing="2"
          text-anchor="middle" dominant-baseline="middle">37</text>
  </g>

  <!-- Reflejo del cristal -->
  <ellipse cx="215" cy="150" rx="150" ry="60" fill="#ffffff" opacity="0.04"/>
</svg>
